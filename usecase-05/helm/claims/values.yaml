replicaCount: 1

frontend:
  image:
    repository: claims-frontend
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    port: 80

backend:
  image:
    repository: claims-backend
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    port: 5001

ingress:
  enabled: true
  className: nginx
  host: claims.local
