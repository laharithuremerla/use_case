apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-frontend
  labels:
    app: claims-frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: claims-frontend
  template:
    metadata:
      labels:
        app: claims-frontend
    spec:
      containers:
        - name: claims-frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: 80
